<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Moon Phase 🌙</title>
    
    <!-- Google Font: Alice -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alice&display=swap" rel="stylesheet">

    <style>
        :root {
            --powder-pink: #FEE1E7;
            --powder-pink-hover: #F8D3DC;
            --pink-dark: #7D2D3E;
            --pink-subtle: #FFF5F7;
            --bg-glass: rgba(255, 255, 255, 0.90);
            --border-glass: rgba(255, 255, 255, 0.95);
            --border-soft: #F4E8EE;
            --text-dark: #322527;
            --text-muted: #8F8B92;
            --shadow-soft: 0 10px 28px rgba(220, 180, 190, 0.16);
            --night-sky-bg: radial-gradient(circle at center, #232030 0%, #151320 100%);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Alice', Georgia, serif;
            background-color: transparent;
            padding: 8px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            color: var(--text-dark);
            -webkit-font-smoothing: antialiased;
        }

        .widget-container {
            width: 100%;
            max-width: 320px;
            background: var(--bg-glass);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--border-glass);
            border-radius: 20px;
            padding: 14px 14px;
            box-shadow: var(--shadow-soft);
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* 1. Header Banner */
        .header-banner {
            background-color: var(--powder-pink);
            padding: 9px 12px;
            border-radius: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-title {
            font-size: 0.85rem;
            font-weight: bold;
            letter-spacing: 0.6px;
            color: var(--pink-dark);
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .date-badge {
            font-size: 0.7rem;
            color: var(--pink-dark);
            opacity: 0.85;
            font-style: italic;
        }

        /* 2. Celestial Canvas Container */
        .celestial-card {
            background: var(--night-sky-bg);
            border-radius: 16px;
            padding: 18px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .moon-graphic-wrapper {
            width: 120px;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 8px;
            filter: drop-shadow(0 0 14px rgba(255, 245, 225, 0.3));
        }

        svg.moon-svg {
            width: 100%;
            height: 100%;
        }

        /* 3. Phase Details & Status Badges */
        .phase-name {
            font-size: 1.05rem;
            color: #FFFFFF;
            text-align: center;
            margin-bottom: 2px;
            letter-spacing: 0.4px;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
        }

        .phase-subtext {
            font-size: 0.72rem;
            color: rgba(255, 255, 255, 0.75);
            font-style: italic;
            margin-bottom: 10px;
        }

        .badge-row {
            display: flex;
            gap: 6px;
            justify-content: center;
            width: 100%;
        }

        .info-pill {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(4px);
            border-radius: 20px;
            color: #FFFFFF;
            font-size: 0.68rem;
            padding: 3px 10px;
            white-space: nowrap;
        }

        /* 4. Stats Summary Box */
        .stats-grid {
            background: var(--pink-subtle);
            border: 1px dashed var(--powder-pink);
            border-radius: 14px;
            padding: 10px 12px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .stat-label {
            font-size: 0.65rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.4px;
            margin-bottom: 2px;
        }

        .stat-value {
            font-size: 0.82rem;
            color: var(--pink-dark);
            font-weight: bold;
        }

        /* Interactive Date Adjuster Footer */
        .footer-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 4px;
        }

        .btn-nav-day {
            background: #ffffff;
            border: 1px solid var(--border-soft);
            border-radius: 8px;
            color: var(--text-dark);
            font-family: 'Alice', serif;
            font-size: 0.7rem;
            padding: 4px 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-nav-day:hover {
            background: var(--powder-pink);
            border-color: var(--powder-pink);
            color: var(--pink-dark);
        }

        .btn-today {
            background: none;
            border: none;
            color: var(--text-muted);
            font-family: 'Alice', serif;
            font-size: 0.7rem;
            cursor: pointer;
            text-decoration: underline;
        }

        .btn-today:hover {
            color: var(--pink-dark);
        }
    </style>
</head>
<body>

<div class="widget-container">
    <!-- Header Banner -->
    <div class="header-banner">
        <span class="header-title">MOON PHASE 🤍</span>
        <span class="date-badge" id="currentDateText">Today</span>
    </div>

    <!-- Celestial Night Display Card -->
    <div class="celestial-card">
        <div class="moon-graphic-wrapper" id="moonSvgContainer">
            <!-- SVG Moon dynamically injected here -->
        </div>

        <div class="phase-name" id="phaseNameTitle">Waxing Gibbous</div>
        <div class="phase-subtext" id="moonEmojiSubtext">🌔 Waxing Crescent</div>

        <div class="badge-row">
            <span class="info-pill" id="illuminationBadge">85% Illuminated</span>
            <span class="info-pill" id="nextFullMoonBadge">Full Moon in 3 days</span>
        </div>
    </div>

    <!-- Stats Grid -->
    <div class="stats-grid">
        <div class="stat-item">
            <span class="stat-label">Moon Age</span>
            <span class="stat-value" id="moonAgeText">10.5 Days</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">Lunar Cycle</span>
            <span class="stat-value" id="lunarCycleText">29.53 Days</span>
        </div>
    </div>

    <!-- Day Navigation Controls -->
    <div class="footer-nav">
        <button class="btn-nav-day" onclick="changeDay(-1)">‹ Prev Day</button>
        <button class="btn-today" onclick="resetToToday()">Today</button>
        <button class="btn-nav-day" onclick="changeDay(1)">Next Day ›</button>
    </div>
</div>

<script>
    // State management for relative date shifts
    let dayOffset = 0;

    // Synodic Month Reference Constants
    const SYNODIC_MONTH = 29.53058770576; // Average lunar cycle length in days
    // Known Reference New Moon Epoch (Jan 11, 2024 11:57 UTC)
    const KNOWN_NEW_MOON_EPOCH = new Date(Date.UTC(2024, 0, 11, 11, 57, 0)).getTime();

    function getTargetDate() {
        const d = new Date();
        d.setDate(d.getDate() + dayOffset);
        return d;
    }

    /**
     * Astronomical Moon Phase Calculation
     */
    function calculateMoonPhase(date) {
        const timeMs = date.getTime();
        const diffDays = (timeMs - KNOWN_NEW_MOON_EPOCH) / 86400000;
        
        // Exact age within current 29.53 day synodic cycle
        let lunarAge = (diffDays % SYNODIC_MONTH + SYNODIC_MONTH) % SYNODIC_MONTH;
        
        // Normalized phase ratio (0.0 to 1.0)
        const phaseRatio = lunarAge / SYNODIC_MONTH;
        
        // Illumination Percentage (0% to 100%)
        const illumination = Math.round((1 - Math.cos(phaseRatio * 2 * Math.PI)) / 2 * 100);

        // Days until next Full Moon (Full moon happens at phaseRatio ~ 0.5 or ~14.765 days)
        const fullMoonAge = SYNODIC_MONTH / 2;
        let daysUntilFull = Math.round((fullMoonAge - lunarAge + SYNODIC_MONTH) % SYNODIC_MONTH);
        if (daysUntilFull === 0 && Math.abs(lunarAge - fullMoonAge) > 0.5) {
            daysUntilFull = Math.round(SYNODIC_MONTH);
        }

        // Determine Phase Name & Emoji
        let phaseName = "";
        let emoji = "";

        if (lunarAge < 1.84 || lunarAge >= 27.68) {
            phaseName = "New Moon";
            emoji = "🌑";
        } else if (lunarAge < 5.53) {
            phaseName = "Waxing Crescent";
            emoji = "🌒";
        } else if (lunarAge < 9.22) {
            phaseName = "First Quarter";
            emoji = "🌓";
        } else if (lunarAge < 12.91) {
            phaseName = "Waxing Gibbous";
            emoji = "🌔";
        } else if (lunarAge < 16.61) {
            phaseName = "Full Moon";
            emoji = "🌕";
        } else if (lunarAge < 20.30) {
            phaseName = "Waning Gibbous";
            emoji = "🌖";
        } else if (lunarAge < 23.99) {
            phaseName = "Last Quarter";
            emoji = "🌗";
        } else {
            phaseName = "Waning Crescent";
            emoji = "🌘";
        }

        return {
            lunarAge,
            phaseRatio,
            illumination,
            daysUntilFull,
            phaseName,
            emoji
        };
    }

    /**
     * Dynamic SVG Moon Vector Path Generator
     */
    function renderMoonSvg(phaseRatio, illumination) {
        const cx = 60;
        const cy = 60;
        const r = 46;

        // Special Full Moon or New Moon extremes
        if (illumination >= 98) {
            return `
                <svg class="moon-svg" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <radialGradient id="fullGlow" cx="50%" cy="50%" r="50%">
                            <stop offset="0%" stop-color="#FFFDF7" />
                            <stop offset="85%" stop-color="#FFF2D6" />
                            <stop offset="100%" stop-color="#EADAB6" />
                        </radialGradient>
                        <filter id="glow">
                            <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
                            <feMerge>
                                <feMergeNode in="coloredBlur"/>
                                <feMergeNode in="SourceGraphic"/>
                            </feMerge>
                        </filter>
                    </defs>
                    <circle cx="${cx}" cy="${cy}" r="${r}" fill="url(#fullGlow)" filter="url(#glow)" />
                    <!-- Crater Accents -->
                    <circle cx="45" cy="45" r="7" fill="#E2D0A6" opacity="0.3" />
                    <circle cx="75" cy="65" r="9" fill="#E2D0A6" opacity="0.25" />
                    <circle cx="65" cy="38" r="5" fill="#E2D0A6" opacity="0.2" />
                </svg>
            `;
        }

        if (illumination <= 2) {
            return `
                <svg class="moon-svg" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="${cx}" cy="${cy}" r="${r}" fill="#242131" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
                    <circle cx="50" cy="50" r="8" fill="#1C1A27" opacity="0.5" />
                    <circle cx="70" cy="65" r="10" fill="#1C1A27" opacity="0.4" />
                </svg>
            `;
        }

        // Construct Mathematical Crescent/Gibbous SVG Path
        // Outer arc is a semicircle, inner arc bulges based on cosine of phase angle
        const rx = Math.abs(r * Math.cos(phaseRatio * 2 * Math.PI));
        let pathD = "";

        if (phaseRatio < 0.5) {
            // Waxing (Illuminated on the Right)
            const sweepInner = phaseRatio < 0.25 ? 0 : 1;
            pathD = `M ${cx} ${cy - r} A ${r} ${r} 0 0 1 ${cx} ${cy + r} A ${rx} ${r} 0 0 ${sweepInner} ${cx} ${cy - r}`;
        } else {
            // Waning (Illuminated on the Left)
            const sweepInner = phaseRatio < 0.75 ? 0 : 1;
            pathD = `M ${cx} ${cy - r} A ${r} ${r} 0 0 0 ${cx} ${cy + r} A ${rx} ${r} 0 0 ${sweepInner} ${cx} ${cy - r}`;
        }

        return `
            <svg class="moon-svg" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <radialGradient id="moonLitGrad" cx="50%" cy="50%" r="50%">
                        <stop offset="0%" stop-color="#FFFDF7" />
                        <stop offset="85%" stop-color="#FFF2D6" />
                        <stop offset="100%" stop-color="#E5D3AD" />
                    </radialGradient>
                    <filter id="moonGlow">
                        <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
                        <feMerge>
                            <feMergeNode in="coloredBlur"/>
                            <feMergeNode in="SourceGraphic"/>
                        </feMerge>
                    </filter>
                </defs>
                <!-- Dark Moon Base -->
                <circle cx="${cx}" cy="${cy}" r="${r}" fill="#242131" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
                <circle cx="48" cy="48" r="7" fill="#1A1824" opacity="0.4" />
                <circle cx="72" cy="68" r="9" fill="#1A1824" opacity="0.35" />

                <!-- Illuminated Section -->
                <path d="${pathD}" fill="url(#moonLitGrad)" filter="url(#moonGlow)" />
            </svg>
        `;
    }

    function updateMoonWidget() {
        const targetDate = getTargetDate();
        const moonData = calculateMoonPhase(targetDate);

        // Date Display
        const dateOptions = { weekday: 'short', day: 'numeric', month: 'short' };
        const dateStr = dayOffset === 0 ? "Today" : targetDate.toLocaleDateString('en-US', dateOptions);
        document.getElementById('currentDateText').innerText = dateStr;

        // Render Dynamic SVG Moon
        document.getElementById('moonSvgContainer').innerHTML = renderMoonSvg(moonData.phaseRatio, moonData.illumination);

        // Titles and Status
        document.getElementById('phaseNameTitle').innerText = moonData.phaseName;
        document.getElementById('moonEmojiSubtext').innerText = `${moonData.emoji} ${moonData.phaseName}`;
        document.getElementById('illuminationBadge').innerText = `${moonData.illumination}% Illuminated`;

        if (moonData.daysUntilFull === 0 || moonData.illumination >= 98) {
            document.getElementById('nextFullMoonBadge').innerText = `Full Moon Today 🌕`;
        } else {
            document.getElementById('nextFullMoonBadge').innerText = `Full Moon in ${moonData.daysUntilFull}d 🌕`;
        }

        // Stats Box
        document.getElementById('moonAgeText').innerText = `${moonData.lunarAge.toFixed(1)} Days`;
        document.getElementById('lunarCycleText').innerText = `29.53 Days`;
    }

    function changeDay(delta) {
        dayOffset += delta;
        updateMoonWidget();
    }

    function resetToToday() {
        dayOffset = 0;
        updateMoonWidget();
    }

    // Resilience initialization handler for Notion iframe embeds
    function initMoonWidget() {
        try {
            updateMoonWidget();
        } catch (e) {
            console.warn("Unable to initialize moon widget:", e);
        }
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initMoonWidget);
    } else {
        initMoonWidget();
    }
</script>

</body>
</html>
