<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Official Moon Phase Widget 🌙</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: transparent;
            margin: 0;
            padding: 4px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Sleek minimalist container custom fitted to wrap the astronomy framework frame */
        .widget-container {
            width: 100%;
            max-width: 320px;
            background-color: #050505;
            border-radius: 12px;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #1a1a1a;
        }

        /* Clean alignment mapping for nested content structures */
        .iframe-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
            overflow: hidden;
        }

        /* Direct filter manipulation overlay to blend background colors cleanly into dark mode templates */
        iframe, #moonphase_widget {
            border: none !important;
            filter: invert(1) hue-rotate(180deg) brightness(0.95);
        }
    </style>
</head>
<body>

<div class="widget-container">
    <div class="iframe-wrapper">
        <!-- Official live data collection script from MoonPhases.co.uk tools hub registry -->
        <script type="text/javascript" src="https://moonphases.co.uk" id="moonphase_widget" widget="tall" lat="" lng="" date="" tz=""></script>
    </div>
</div>

</body>
</html>
